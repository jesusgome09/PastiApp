<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Recordatorio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/x-icon">
    
    <!-- Integración de OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "496d72f4-01e1-4e0e-b0da-a2df55463b67",
          safari_web_id: "web.onesignal.auto.5ecc7e9f-2540-4c26-bcd6-80ea5ac40604",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Hola, Natalia ✨</h1>
            <p id="fecha-hoy"></p>
        </header>

        <section class="action-card">
            <h2 id="status-message">¿Ya tomaste tu pastilla hoy?</h2>
            <button id="btn-tomar" class="btn-primary">¡Ya la tomé!</button>
        </section>

        <section class="calendar-section">
            <h3>Tu historial de este mes</h3>
            <div class="calendar-grid" id="calendar-grid">
                <!-- El calendario se genera con JS -->
            </div>
        </section>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
